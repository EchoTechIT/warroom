# Ollama on AMD Radeon AI PRO R9700 (RDNA4 / gfx1201) via ROCm.
#
# WHY THIS EXISTS: the EchoTechAIStack substrate ships an NVIDIA-only GPU overlay
# (`driver: nvidia`), which cannot bind an AMD card — Ollama would silently fall
# back to CPU. Use THIS overlay instead of docker-compose.gpu.yml on the R9700.
#
# Usage (from the EchoTechAIStack dir, with this file copied in):
#   COMPOSE_FILE=docker-compose.yml:ollama.rocm.yml docker compose up -d
#
# Requires: host ROCm >= 6.4 (RDNA4 support), user in `render`/`video` groups.
services:
  ollama:
    image: ollama/ollama:rocm       # ROCm build of Ollama (NOT the default CUDA image)
    devices:
      - /dev/kfd                     # ROCm compute device
      - /dev/dri                     # GPU render nodes
    group_add:
      - video
      - render
    environment:
      # RDNA4 (gfx1201) may need a gfx override until ROCm ships native tuning
      # for the card; set to the nearest supported ISA if `rocminfo` complains.
      # Leave UNSET first and only add if the model won't load on GPU.
      - HSA_OVERRIDE_GFX_VERSION=12.0.0
      - OLLAMA_KEEP_ALIVE=30m
    # No `deploy.resources.reservations.devices` block — that path is NVIDIA
    # Container Toolkit-specific and does nothing for ROCm.
